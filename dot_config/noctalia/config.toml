# Declarative Noctalia v5 config: only settings the GUI does not hold.
# The settings GUI (~/.local/state/noctalia/settings.toml) is the source of truth
# for everything else, including the bar layout and widgets.

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"
mode = "dark"
pure_black_dark = false

[wallpaper]
transition = [ "fade", "disc", "stripes", "wipe", "honeycomb" ]
edge_smoothness = 0.05

    [wallpaper.automation]
    interval_seconds = 300
    order = "random"

[location]
auto_locate = false
address = "Nantes"
custom_schedule = false

[nightlight]
enabled = true
force = false
temperature_day = 6500
temperature_night = 2502

[osd]
position = "top_right"

[lockscreen]
fingerprint = false

[shell]
avatar_path = "/home/nervousfish/Pictures/ER/130.jpg"

[bar.default]
# GUI holds the rest of the bar; only the center list comes from here.
center = [ "workspaces" ]

[widget.media]
type = "media"
max_length = 145.0
title_scroll = "on_hover"

[widget.workspaces]
type = "workspaces"
hide_when_empty = false
labels_only_when_occupied = true
max_label_chars = 2
focused_color = "primary"
occupied_color = "secondary"
empty_color = "secondary"
